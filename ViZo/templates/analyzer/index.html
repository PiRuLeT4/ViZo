{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViZo - Repository Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/analyzer.css' %}?v=3" />
    <link rel="icon" type="image/x-icon" href="{% static 'favicon1.png' %}" />
    <script src="{% static 'js/analyzer.js' %}?v=3" defer></script>
  </head>
  <body>
    <!-- Background Design Elements -->
    <div class="glow-sphere glow-cyan"></div>
    <div class="glow-sphere glow-magenta"></div>
    <div class="grid-overlay"></div>

    <div class="container">
      <div class="card">
        <div class="header">
          <div class="logo">
            <span class="logo-text">VZ</span>
          </div>
          <h1 class="vizo-title">VIZO_ANALYZE</h1>
          <p class="subtitle">
            Ingeniería Inversa de Código & Visualización XR
          </p>
        </div>

        <form id="analyzerForm" action="{% url 'index' %}" method="post">
          {% csrf_token %}
          <div class="form-group">
            <label for="repoUrl">Target Repository URL</label>
            <div class="input-wrapper">
              <input
                type="url"
                id="repoUrl"
                name="repoUrl"
                placeholder="https://github.com/usuario/repositorio"
                required
                autocomplete="off"
              />
              <svg
                class="input-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                ></path>
              </svg>
            </div>
            <p class="helper-text" id="helperText">
              <span id="statusIcon">⚡</span>
              <span id="statusInfo">Esperando flujo de datos externo...</span>
            </p>
          </div>

          <button type="submit" id="submitBtn">Iniciar Análisis</button>
        </form>

        <div class="features">
          <div class="feature">
            <div class="feature-icon">📊</div>
            <div class="feature-title">XR VISUAL</div>
          </div>
          <div class="feature">
            <div class="feature-icon">🔍</div>
            <div class="feature-title">DEEP METRICS</div>
          </div>
          <div class="feature">
            <div class="feature-icon">⚡</div>
            <div class="feature-title">FAST FLOW</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
