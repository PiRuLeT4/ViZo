    <!-- Room boundary constraint -->
    <script>
      AFRAME.registerComponent("room-bounds", {
        schema: {
          minX: { default: -19 },
          maxX: { default: 19 },
          minY: { default: 1 },
          maxY: { default: 8.5 },
          minZ: { default: -19 },
          maxZ: { default: 19 },
        },
        tick: function () {
          var p = this.el.object3D.position;
          var d = this.data;
          if (p.x < d.minX) p.x = d.minX;
          if (p.x > d.maxX) p.x = d.maxX;
          if (p.y < d.minY) p.y = d.minY;
          if (p.y > d.maxY) p.y = d.maxY;
          if (p.z < d.minZ) p.z = d.minZ;
          if (p.z > d.maxZ) p.z = d.maxZ;
        },
      });
    </script>

    <!-- ── Nav-button: hover + click con raycaster ── -->
    <script>
      AFRAME.registerComponent("nav-button", {
        schema: { href: { type: "string", default: "/" } },
        init: function () {
          var el = this.el;
          var data = this.data;
          var defaultEmissive = "#00d4ff";
          var hoverEmissive = "#ffffff";

          el.addEventListener("mouseenter", function () {
            // Iluminar panel y bordes al hacer hover
            el.querySelectorAll("[data-nav-panel]").forEach(function (child) {
              child.setAttribute("emissive", hoverEmissive);
              child.setAttribute("emissive-intensity", "3");
            });
            el.setAttribute("scale", "1.04 1.04 1.04");
          });

          el.addEventListener("mouseleave", function () {
            el.querySelectorAll("[data-nav-panel]").forEach(function (child) {
              child.setAttribute("emissive", defaultEmissive);
              child.setAttribute("emissive-intensity", "2");
            });
            el.setAttribute("scale", "1 1 1");
          });

          el.addEventListener("click", function () {
            window.location.href = data.href;
          });
        },
      });
    </script>

          emissive-intensity="1.2"
        ></a-box>
        <!-- Texto principal -->
        <a-text
          data-nav-panel
          value="ANALIZAR MAS CODIGO"
          position="0.6 0.12 0.1"
          align="center"
          color="#00d4ff"
          emissive="#00d4ff"
          emissive-intensity="2"
          width="4"
          font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
        ></a-text>
        <!-- Punto de luz que ilumina el cartel -->
        <a-entity
          light="type: point; color: #00d4ff; intensity: 1.2; distance: 6; decay: 2"
          position="0 0 1"
        ></a-entity>
      </a-entity>

      <!-- ════════════════════════════════════════
           DJANGO DATA — no tocar
           ════════════════════════════════════════ -->

      <!-- Data containers: JSON pasado desde Django -->
      <div id="vizo-data-json" style="display: none">
        {{ data_to_display | safe }}
      </div>
      <div id="vizo-language-json" style="display: none">
        {{ data_by_language | safe }}
      </div>
      <div id="vizo-ai-config" style="display: none">
        {{ ai_config | safe }}
      </div>

      <!-- Cargador de datos BabiaXR (babia-queryjson se asigna en JS) -->
      <a-entity id="cargador"></a-entity>

      <!--
        El componente de visualización (babia-city / babia-doughnut / babia-cyls)
        es creado DINÁMICAMENTE por visualization.js según la config de la IA.
        NO hardcodear ningún componente BabiaXR aquí.
      -->

      <script src="{% static 'js/visualization.js' %}"></script>

      <!-- ── CAMERA (confined to room) ── -->
      <a-entity
        movement-controls
        position="0 1.5 19"
        room-bounds="minX: -19; maxX: 19; minY: 1; maxY: 8.5; minZ: -19; maxZ: 39"
      >
        <a-entity camera position="0 0 0" look-controls></a-entity>
        <a-entity cursor="rayOrigin:mouse"></a-entity>
        <a-entity laser-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
