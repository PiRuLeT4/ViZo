<!-- Interfaz interactiva para volver al analizador -->
<a-entity
  id="nav-analyzer-btn"
  nav-button="href: /analyzer/"
  position="-15.7 1.5 18.5"
  rotation="0 90 0"
>
  <!-- Sleek Backplate (Smaller, cleaner size) -->
  <a-plane
    position="0 0 -0.02"
    width="1.6"
    height="0.9"
    color="#0c0c12"
    material="opacity: 0.85; transparent: true; roughness: 0.5; metalness: 0.1"
  ></a-plane>

  <!-- Glowing bordeaux outline frame for the plate (half size) -->
  <a-box position="0  0.45 0" width="1.64" height="0.02" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>
  <a-box position="0 -0.45 0" width="1.64" height="0.02" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>
  <a-box position="-0.82 0 0" width="0.02" height="0.90" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>
  <a-box position=" 0.82 0 0" width="0.02" height="0.90" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>

  <!-- Panel Header Title (half size) -->
  <a-text
    value="VOLVER AL ANALIZADOR"
    position="0 0.28 0.02"
    align="center"
    width="2.6"
    color="#D4364F"
    emissive="#D4364F"
    emissive-intensity="0.6"
    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
  ></a-text>

  <a-text
    value="PULSA PARA INICIAR OTRO ANALISIS"
    position="0 0.12 0.02"
    align="center"
    width="1.6"
    color="#a0aec0"
    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
  ></a-text>

  <!-- Professional rectangular button (half size) -->
  <a-box
    class="clickable"
    data-nav-panel
    position="0 -0.22 0.02"
    width="1.0"
    height="0.25"
    depth="0.03"
    color="#1a1a24"
    material="roughness: 0.5; metalness: 0.1"
  >
    <!-- Centered return text -->
    <a-text
      value="INICIO"
      align="center"
      baseline="center"
      position="0 0 0.018"
      width="2.6"
      color="#ffffff"
      font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
    ></a-text>
  </a-box>

  <!-- Subtle point light behind/around the panel -->
  <a-entity
    light="type: point; color: #8B0A2E; intensity: 0.4; distance: 3; decay: 2"
    position="0 0 0.8"
  ></a-entity>
</a-entity>
