<!-- Interfaz interactiva para volver al analizador (Panel Vertical Corregido) -->
<a-entity
  id="nav-analyzer-btn"
  nav-button="href: /analyzer/"
  position="-23.7 4.2 27.0"
  rotation="0 90 0"
  scale="2.0 2.0 2.0"
>
  <!-- Sleek Vertical Backplate -->
  <a-plane
    position="0 0 -0.02"
    width="1.0"
    height="1.3"
    color="#0c0c12"
    material="opacity: 0.85; transparent: true; roughness: 0.5; metalness: 0.1"
  ></a-plane>

  <!-- Glowing bordeaux outline frame for vertical plate -->
  <a-box position="0  0.65 0" width="1.04" height="0.02" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>
  <a-box position="0 -0.65 0" width="1.04" height="0.02" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>
  <a-box position="-0.52 0 0" width="0.02" height="1.30" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>
  <a-box position=" 0.52 0 0" width="0.02" height="1.30" depth="0.015" color="#8B0A2E" emissive="#8B0A2E" emissive-intensity="1.2"></a-box>

  <!-- Panel Header Title -->
  <a-text
    value="VOLVER AL ANALIZADOR"
    position="0 0.42 0.02"
    align="center"
    width="0.85"
    wrap-count="16"
    color="#D4364F"
    emissive="#D4364F"
    emissive-intensity="0.6"
    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
  ></a-text>

  <!-- Subtitle -->
  <a-text
    value="PULSA PARA INICIAR\nOTRO ANALISIS"
    position="0 0.08 0.02"
    align="center"
    width="0.80"
    wrap-count="20"
    color="#a0aec0"
    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
  ></a-text>

  <!-- Professional rectangular button -->
  <a-box
    class="clickable"
    data-nav-panel
    position="0 -0.32 0.02"
    width="0.75"
    height="0.28"
    depth="0.03"
    color="#1a1a24"
    material="roughness: 0.5; metalness: 0.1"
  >
    <!-- Centered return text -->
    <a-text
      value="INICIO"
      align="center"
      baseline="center"
      position="0 0 0.018"
      width="1.8"
      color="#ffffff"
      font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
    ></a-text>
  </a-box>

  <!-- Subtle point light behind/around the panel -->
  <a-entity
    light="type: point; color: #8B0A2E; intensity: 0.4; distance: 3; decay: 2"
    position="0 0 0.8"
  ></a-entity>
</a-entity>
