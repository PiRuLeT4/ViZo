<!-- Interfaz interactiva para volver al analizador -->
<a-entity
  id="nav-analyzer-btn"
  nav-button="href: /"
  position="12.5 2.5 38.8"
  rotation="0 180 0"
>
  <!-- Texto interactivo (ahora flotando encima del botón) -->
  <a-text
    value="ANALIZAR MAS CODIGO"
    position="0 1.2 0"
    align="center"
    color="#00d4ff"
    emissive="#00d4ff"
    emissive-intensity="2"
    width="6"
    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
  ></a-text>

  <!-- Base del botón pegada a la pared (anillo oscuro) -->
  <a-cylinder
    position="0 0 0.05"
    rotation="90 0 0"
    radius="0.7"
    height="0.1"
    color="#08111f"
    metalness="0.9"
    roughness="0.1"
  ></a-cylinder>

  <!-- El botón circular interactivo que sobresale -->
  <a-cylinder
    class="clickable"
    data-nav-panel
    position="0 0 0.2"
    rotation="90 0 0"
    radius="0.55"
    height="0.3"
    color="#001a3a"
    emissive="#001a3a"
    emissive-intensity="1"
    metalness="0.5"
    roughness="0.2"
  ></a-cylinder>

  <!-- Icono central (decoración holográfica verde tipo "Play") -->
  <a-triangle
    position="0 0 0.36"
    rotation="0 0 -90"
    vertex-a="0 0.2 0"
    vertex-b="-0.2 -0.15 0"
    vertex-c="0.2 -0.15 0"
    color="#4af7a0"
    emissive="#4af7a0"
    emissive-intensity="1.5"
  ></a-triangle>

  <!-- Luz puntual local para que el botón ilumine un poco la pared -->
  <a-entity
    light="type: point; color: #00d4ff; intensity: 1.2; distance: 4; decay: 2"
    position="0 0 1"
  ></a-entity>
</a-entity>
